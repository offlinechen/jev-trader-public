[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-trader"
version = "0.1.0"
description = "Jev probabilistic trading system"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyarrow>=14",
    "pyyaml>=6",
]

[project.optional-dependencies]
research = ["lightgbm>=4", "scikit-learn>=1.3"]
dev = ["pytest>=7", "scikit-learn>=1.3"]

[project.scripts]
jev = "jev_trader.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
